# Proyecto de Xcode generado con XcodeGen: `brew install xcodegen && xcodegen`
# Así el .xcodeproj no se versiona y no hay conflictos de merge en él.
name: Xpersiva
options:
  bundleIdPrefix: app.xpersiva
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""        # tu Team ID de Apple
targets:
  Xpersiva:
    type: application
    platform: iOS
    sources: [Xpersiva]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.xpersiva.player
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Xpersiva/Xpersiva.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Xpersiva/Info.plist
      properties:
        CFBundleDisplayName: Xpersiva
        # Fondo de arranque azul noche, el color del primer fotograma de
        # Recursos/startup-intro.mp4: así no hay salto entre el sistema y el vídeo.
        UILaunchScreen:
          UIColorName: FondoArranque
        # La marca va sobre superficies claras (el logo de cabecera es oscuro).
        UIUserInterfaceStyle: Light
        # Portrait en toda la app; el mando por giroscopio pide horizontal solo en su
        # pantalla (ver OrientacionApp.swift), pero necesita que el sistema lo tenga
        # declarado aquí o no gira aunque el delegate lo permita.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Xpersiva usa la cámara solo para escanear el código QR de la experiencia.
        NSLocationWhenInUseUsageDescription: Xpersiva usa tu ubicación solo para enseñarte primero las experiencias que tienes más cerca.
        NSLocalNetworkUsageDescription: Xpersiva se conecta a la experiencia del evento a través de la red Wi-Fi local.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.xpersiva.player
            CFBundleURLSchemes: [xpersiva]
