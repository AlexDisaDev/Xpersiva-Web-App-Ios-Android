<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xpersiva · Experiencia</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main>
  <a class="logo" href="/">xpersiva</a>
  <div id="card" style="margin-top:24px">
    <div class="tag" id="brand"></div>
    <h1 id="name">Cargando…</h1>
    <div id="meta"></div>
    <p id="desc"></p>
    <div class="btns" id="stores"></div>
    <div class="btns"><a class="btn ghost hidden" id="map" target="_blank" rel="noopener">Cómo llegar</a></div>
  </div>
</main>
<script src="/site.js"></script>
<script>
'use strict';
// Una página por experiencia: /e/<id>. Si el móvil tiene la app, este mismo
// enlace abre la ficha dentro de la app.
const X = window.XPERSIVA;
const id = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');

X.experiences().then((items) => {
  const e = items.find((x) => x.id === id);
  if (!e) { X.text(document.getElementById('name'), 'Esta experiencia ya no está disponible'); return; }
  document.title = 'Xpersiva · ' + e.name;
  X.text(document.getElementById('brand'), (e.brand || '').toUpperCase());
  X.text(document.getElementById('name'), e.name);
  const fmt = (d) => new Date(d).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
  const when = [e.startsAt, e.endsAt].filter(Boolean).map(fmt).join(' – ');
  X.text(document.getElementById('meta'), [e.venue, e.city, when, X.isLive(e) ? 'ahora' : ''].filter(Boolean).join(' · '));
  X.text(document.getElementById('desc'), e.description || '');
  const map = document.getElementById('map');
  map.href = 'https://www.google.com/maps/search/?api=1&query=' + e.lat + ',' + e.lng;
  map.classList.remove('hidden');
  X.storeButtons(document.getElementById('stores'));
}).catch(() => X.text(document.getElementById('name'), 'No se ha podido cargar'));
</script>
</body>
</html>
