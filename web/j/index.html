<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xpersiva · Únete</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main>
  <a class="logo" href="/">xpersiva</a>
  <div class="tag" id="code"></div>
  <h1>Descarga Xpersiva para jugar</h1>
  <p id="msg">Con la app, tu móvil se convierte en el mando.</p>
  <div class="btns" id="stores"></div>
  <div class="btns"><a class="btn ghost hidden" id="web" href="#">Jugar sin instalar</a></div>
</main>
<script src="/site.js"></script>
<script>
'use strict';
// Destino de los QR de los juegos: /j/<CODIGO>?h=<IP:PUERTO>
// Si el móvil tiene la app, iOS y Android la abren con este enlace y esta
// página no llega a verse. Si no la tiene, le mandamos a su tienda.
const X = window.XPERSIVA;
const code = (location.pathname.split('/').filter(Boolean)[1] || '').toUpperCase();
const params = new URLSearchParams(location.search);
const host = params.get('h') || '';
const secure = params.get('s') === '1';
const validCode = /^[A-Z0-9][A-Z0-9-]{1,31}$/.test(code);
const validHost = /^[a-z0-9.-]+(:\d{1,5})?$/i.test(host);

if (validCode) X.text(document.getElementById('code'), 'EXPERIENCIA ' + code);

// Google Play guarda el "referrer" y la app lo lee al abrirse por primera
// vez, para entrar directa a la experiencia tras instalarla.
const referrer = validCode && validHost
  ? '&referrer=' + encodeURIComponent('code=' + code + '&h=' + host + (secure ? '&s=1' : ''))
  : '';
X.storeButtons(document.getElementById('stores'), referrer);

// El propio juego sirve un mando web (plugin websocket): se puede jugar sin
// instalar si se está en la misma Wi-Fi.
let cancelled = false;
if (validHost) {
  const web = document.getElementById('web');
  web.href = (secure ? 'https://' : 'http://') + host + '/';
  web.classList.remove('hidden');
  web.addEventListener('click', () => { cancelled = true; });
}

// En el móvil vamos solos a la tienda tras un momento, por si prefiere jugar sin instalar.
if (X.platform !== 'desktop') {
  const target = X.platform === 'ios' ? X.appStore : X.googlePlay + referrer;
  let left = 3;
  const msg = document.getElementById('msg');
  const tick = () => {
    if (cancelled) return;
    if (left === 0) { location.href = target; return; }
    X.text(msg, 'Te llevamos a la tienda en ' + left + '…');
    left -= 1;
    setTimeout(tick, 1000);
  };
  tick();
}
</script>
</body>
</html>
